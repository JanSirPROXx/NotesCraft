name: Native builds and tests
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Core and PDF rendering tests
        run: swift test
      - name: Marketplace catalog
        run: python3 scripts/catalog.py check
      - name: macOS application and Xcode tests
        run: xcodebuild -project NoteCraft.xcodeproj -scheme NoteCraft -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test
      - name: iPad simulator application
        run: xcodebuild -project NoteCraft.xcodeproj -scheme NoteCraft -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: iPad folder selection and drawing
        timeout-minutes: 12
        run: |
          ipad_simulator_id="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if "iPad" in d["name"]))')"
          xcodebuild -project NoteCraft.xcodeproj -scheme NoteCraft-iPad -destination "platform=iOS Simulator,id=$ipad_simulator_id" -parallel-testing-enabled NO -resultBundlePath TestResults/iPad.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Save iPad UI diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ipad-test-results
          path: TestResults/iPad.xcresult
          if-no-files-found: ignore
