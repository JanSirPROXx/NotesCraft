name: NoteCraft
options:
  bundleIdPrefix: app.notecraft
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
  configs:
    # An unoptimized Swift build is 10 to 40 times slower on the work this app does per pen event
    # (erasing, scribble, shape fitting, saving), so runs from Xcode would feel nothing like the
    # shipped app. Set this to -Onone only when stepping through code line by line.
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -O
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
targets:
  NoteCraftCore:
    type: framework
    supportedDestinations: [iOS, macOS]
    sources: [Sources/NoteCraftCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.notecraft.core
  NoteCraft:
    type: application
    supportedDestinations: [iOS]
    sources:
      - Sources/NoteCraft
      # The starter packs of the marketplace, so it works before the first download and without a network.
      - path: catalog
        type: folder
        buildPhase: resources
    dependencies:
      - target: NoteCraftCore
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The editor is built around a large canvas and Apple Pencil; iPad only.
        TARGETED_DEVICE_FAMILY: '2'
        # No "Designed for iPad" build on Apple Silicon Macs: the editor is built around Apple Pencil.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        PRODUCT_BUNDLE_IDENTIFIER: notescraft
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: NotesCraft
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    info:
      path: Config/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        NSCameraUsageDescription: Scan paper documents into a notebook.
        CFBundleDocumentTypes:
          - CFBundleTypeName: NotesCraft Notebook
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: YES
            LSItemContentTypes: [app.notecraft.notebook]
          - CFBundleTypeName: NotesCraft Theme
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSTypeIsPackage: YES
            LSItemContentTypes: [app.notecraft.theme]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.notecraft.notebook
            UTTypeDescription: NotesCraft Notebook
            UTTypeConformsTo: [com.apple.package]
            UTTypeTagSpecification:
              public.filename-extension: [notecraft]
          - UTTypeIdentifier: app.notecraft.theme
            UTTypeDescription: NotesCraft Theme
            UTTypeConformsTo: [com.apple.package]
            UTTypeTagSpecification:
              public.filename-extension: [notecrafttheme]

  NoteCraftCoreTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [Tests/NoteCraftCoreTests]
    dependencies:
      - target: NoteCraftCore
  NoteCraftUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources: [Tests/NoteCraftUITests]
    dependencies:
      - target: NoteCraft
schemes:
  NoteCraft:
    build:
      targets:
        NoteCraftCore: all
        NoteCraftCoreTests: [test]
    test:
      targets: [NoteCraftCoreTests]
  NoteCraft-iPad:
    build:
      targets:
        NoteCraft: all
        NoteCraftUITests: [test]
    test:
      targets: [NoteCraftUITests]
