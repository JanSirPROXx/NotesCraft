name: NoteCraft
options:
  bundleIdPrefix: app.notecraft
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
targets:
  NoteCraftCore:
    type: framework
    supportedDestinations: [iOS, macOS]
    sources: [Sources/NoteCraftCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.notecraft.core
  NoteCraft:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Sources/NoteCraft]
    dependencies:
      - target: NoteCraftCore
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: app.notecraft.app
        INFOPLIST_KEY_CFBundleDisplayName: NoteCraft
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_CADisableMinimumFrameDurationOnPhone: YES
    info:
      path: Config/Info.plist
      properties:
        NSCameraUsageDescription: Scan paper documents into a notebook.
        CFBundleDocumentTypes:
          - CFBundleTypeName: NoteCraft Notebook
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: YES
            LSItemContentTypes: [app.notecraft.notebook]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.notecraft.notebook
            UTTypeDescription: NoteCraft Notebook
            UTTypeConformsTo: [com.apple.package]
            UTTypeTagSpecification:
              public.filename-extension: [notecraft]

  NoteCraftCoreTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [Tests/NoteCraftCoreTests]
    dependencies:
      - target: NoteCraftCore
  NoteCraftUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources: [Tests/NoteCraftUITests]
    dependencies:
      - target: NoteCraft
schemes:
  NoteCraft:
    build:
      targets:
        NoteCraft: all
        NoteCraftCoreTests: [test]
    test:
      targets: [NoteCraftCoreTests]
  NoteCraft-iPad:
    build:
      targets:
        NoteCraft: all
        NoteCraftUITests: [test]
    test:
      targets: [NoteCraftUITests]
